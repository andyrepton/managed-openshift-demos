# The same forwarder as cluster-log-store.yaml, plus application logs from one
# namespace (logging-demo, see app.yaml). Applying it updates the forwarder in
# place and the collectors restart with the new pipeline.
apiVersion: observability.openshift.io/v1
kind: ClusterLogForwarder
metadata:
  name: lokistack
  namespace: openshift-logging
spec:
  serviceAccount:
    name: logging-collector
  inputs:
  - name: logging-demo-logs
    type: application
    application:
      includes:
      - namespace: logging-demo
  outputs:
  - name: lokistack-out
    type: lokiStack
    lokiStack:
      target:
        name: logging-loki
        namespace: openshift-logging
      authentication:
        token:
          from: serviceAccount
    tls:
      ca:
        key: service-ca.crt
        configMapName: logging-loki-gateway-ca-bundle
  pipelines:
  - name: infrastructure-logs
    inputRefs:
    - infrastructure
    outputRefs:
    - lokistack-out
  - name: application-logs
    inputRefs:
    - logging-demo-logs
    outputRefs:
    - lokistack-out
