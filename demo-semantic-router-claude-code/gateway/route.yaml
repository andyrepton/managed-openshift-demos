apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: semantic-router
  namespace: openshift-ingress
  annotations:
    haproxy.router.openshift.io/timeout: 10m
spec:
  host: semantic-router.REPLACE_WITH_CLUSTER_DOMAIN
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: semantic-router-gateway-data-science-gateway-class
