apiVersion: v1
kind: Namespace
metadata:
  name: custom-udi
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: custom-udi
  namespace: custom-udi
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: custom-udi
  namespace: custom-udi
spec:
  output:
    to:
      kind: ImageStreamTag
      name: custom-udi:latest
  source:
    type: Git
    git:
      uri: https://github.com/andyrepton/managed-openshift-demos.git
      ref: main
    contextDir: demo-custom-udi
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile
      # The base image lives in registry.redhat.io. Builds do not use the
      # cluster's global pull secret automatically, so this references a
      # secret linked to the builder service account. See the README.
      pullSecret:
        name: redhat-registry
  triggers: []
  # Requests below limits, explicitly.
  #
  # With only limits set the scheduler reserves the full 2 CPU, and on a busy
  # cluster the build simply never starts: the pod sits unschedulable with
  # "Insufficient cpu" and the build is eventually cancelled, which reads like
  # a broken BuildConfig rather than a full cluster. A build is bursty and does
  # not need its ceiling reserved for the whole run.
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi
