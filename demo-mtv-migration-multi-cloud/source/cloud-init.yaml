apiVersion: v1
kind: Secret
metadata:
  name: where-am-i-cloudinit
  namespace: mtv-demo
type: Opaque
stringData:
  userdata: |-
    #cloud-config
    write_files:
    - path: /usr/local/bin/where-am-i
      permissions: '0755'
      content: |
        #!/usr/bin/python3
        # Serves the where-am-i page on port 8080. Once per boot it asks
        # ipinfo.io which network owns this VM's public IP: Hetzner on
        # premises, Amazon on AWS. A phrase typed into the page is kept on
        # the VM's own disk, so seeing it after a migration proves the disk
        # came across.
        import json, os, socket, threading, time, urllib.parse, urllib.request
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

        PHRASE_FILE = "/var/lib/where-am-i/phrase"
        BOOTED = time.strftime("%H:%M:%S UTC", time.gmtime(time.time() - time.clock_gettime(time.CLOCK_BOOTTIME)))
        info = {}

        def lookup():
            for _ in range(60):
                try:
                    with urllib.request.urlopen("https://ipinfo.io/json", timeout=5) as r:
                        info.update(json.load(r))
                        return
                except Exception:
                    time.sleep(2)

        def where():
            org = info.get("org", "")
            if not info:
                return "Finding out where I am", "", "#6a6e73"
            if "Amazon" in org:
                return "Running on AWS", "Red Hat OpenShift Service on AWS", "#ec7a08"
            if "Hetzner" in org:
                return "Running on premises", "OpenShift in our own datacenter", "#0066cc"
            return "Running somewhere new", org, "#6a6e73"

        def read_phrase():
            try:
                with open(PHRASE_FILE) as f:
                    return f.read()
            except FileNotFoundError:
                return ""

        def save_phrase(text):
            # Written and flushed to disk before replying, so a migration
            # straight afterwards cannot lose it.
            os.makedirs(os.path.dirname(PHRASE_FILE), exist_ok=True)
            tmp = PHRASE_FILE + ".tmp"
            with open(tmp, "w") as f:
                f.write(text)
                f.flush()
                os.fsync(f.fileno())
            os.replace(tmp, PHRASE_FILE)
            fd = os.open(os.path.dirname(PHRASE_FILE), os.O_DIRECTORY)
            os.fsync(fd)
            os.close(fd)

        def status():
            title, detail, colour = where()
            place = ", ".join(x for x in (info.get("city"), info.get("country")) if x)
            return {"title": title, "detail": detail, "colour": colour,
                    "vm": socket.gethostname(), "network": info.get("org", "..."),
                    "ip": info.get("ip", "..."), "location": place or "...",
                    "booted": BOOTED, "phrase": read_phrase()}

        # Values are filled in with textContent, so a phrase cannot inject HTML.
        PAGE = """<!DOCTYPE html>
        <html><head><meta charset="utf-8"><title>Where am I?</title>
        <style>
          body { font-family: 'Red Hat Display', 'Segoe UI', sans-serif; margin: 0; background: #151515; color: #f0f0f0; }
          header { padding: 50px 40px; transition: background 0.5s; }
          h1 { font-size: 4rem; margin: 0; }
          h2 { font-weight: 400; margin: 10px 0 0; min-height: 1.5em; }
          #phrase { font-size: 3rem; margin: 40px; color: #f5c12e; min-height: 1.2em; }
          table { margin: 0 40px; font-size: 1.4rem; border-spacing: 0 10px; }
          td:first-child { color: #a3a3a3; padding-right: 40px; }
          form { margin: 30px 40px; }
          input { font-size: 1.2rem; padding: 8px; width: 28em; }
          button { font-size: 1.2rem; padding: 8px 16px; }
        </style></head>
        <body>
          <header id="banner"><h1 id="title">Loading</h1><h2 id="detail"></h2></header>
          <div id="phrase"></div>
          <table>
            <tr><td>Virtual machine</td><td id="vm"></td></tr>
            <tr><td>Network</td><td id="network"></td></tr>
            <tr><td>Public IP</td><td id="ip"></td></tr>
            <tr><td>Location</td><td id="location"></td></tr>
            <tr><td>Booted</td><td id="booted"></td></tr>
          </table>
          <form id="form"><input id="input" maxlength="200" placeholder="Type a phrase from the audience">
            <button>Save on this VM's disk</button></form>
        <script>
          const ids = ["title", "detail", "vm", "network", "ip", "location", "booted", "phrase"];
          async function refresh() {
            try {
              const r = await fetch("/status", {cache: "no-store"});
              const s = await r.json();
              ids.forEach(id => document.getElementById(id).textContent = s[id]);
              document.getElementById("banner").style.background = s.colour;
            } catch (e) {
              document.getElementById("title").textContent = "Lost contact";
              document.getElementById("detail").textContent = "This VM is no longer running here";
              document.getElementById("banner").style.background = "#a30000";
            }
          }
          document.getElementById("form").onsubmit = async ev => {
            ev.preventDefault();
            const input = document.getElementById("input");
            await fetch("/phrase", {method: "POST", body: new URLSearchParams({phrase: input.value})});
            input.value = "";
            refresh();
          };
          refresh();
          setInterval(refresh, 3000);
        </script>
        </body></html>
        """

        class Handler(BaseHTTPRequestHandler):
            def reply(self, code, body, ctype):
                self.send_response(code)
                self.send_header("Content-Type", ctype)
                self.send_header("Cache-Control", "no-store")
                self.end_headers()
                self.wfile.write(body)

            def do_GET(self):
                if self.path == "/status":
                    self.reply(200, json.dumps(status()).encode(), "application/json")
                else:
                    self.reply(200, PAGE.encode(), "text/html; charset=utf-8")

            def do_POST(self):
                if self.path != "/phrase":
                    return self.reply(404, b"", "text/plain")
                length = min(int(self.headers.get("Content-Length", 0)), 4096)
                form = urllib.parse.parse_qs(self.rfile.read(length).decode("utf-8", "replace"))
                save_phrase(form.get("phrase", [""])[0].strip()[:200])
                self.reply(204, b"", "text/plain")

            def log_message(self, *args):
                pass

        threading.Thread(target=lookup, daemon=True).start()
        ThreadingHTTPServer(("", 8080), Handler).serve_forever()
    - path: /etc/systemd/system/where-am-i.service
      content: |
        [Unit]
        Description=Serve the where-am-i page on port 8080
        Wants=network-online.target
        After=network-online.target
        [Service]
        ExecStart=/usr/local/bin/where-am-i
        Restart=always
        [Install]
        WantedBy=multi-user.target
    runcmd:
    - systemctl daemon-reload
    - systemctl enable --now where-am-i.service
