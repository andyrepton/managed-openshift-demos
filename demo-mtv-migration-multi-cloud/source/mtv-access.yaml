# What MTV on the destination cluster may do on this (source) cluster. MTV's
# documentation asks for a cluster-admin token; this narrower role is what the
# demo has been tested with.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mtv-migration-role
rules:
- apiGroups: ["forklift.konveyor.io"]
  resources: ["*"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets", "namespaces", "configmaps", "persistentvolumes", "persistentvolumeclaims", "pods"]
  verbs: ["get", "list", "watch", "create", "patch", "delete"]
- apiGroups: ["kubevirt.io"]
  resources: ["virtualmachines", "virtualmachineinstances"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["instancetype.kubevirt.io"]
  resources: ["virtualmachineinstancetypes"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: ["cdi.kubevirt.io"]
  resources: ["datavolumes"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: ["k8s.cni.cncf.io"]
  resources: ["network-attachment-definitions"]
  verbs: ["get", "list", "watch", "create"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch", "create", "update"]
# MTV deletes the export when the migration finishes. Without delete it only
# logs "Failed to delete VMExport" and the export server pod keeps running.
- apiGroups: ["export.kubevirt.io"]
  resources: ["virtualmachineexports"]
  verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mtv
  namespace: mtv-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mtv-migration-binding
subjects:
- kind: ServiceAccount
  name: mtv
  namespace: mtv-demo
roleRef:
  kind: ClusterRole
  name: mtv-migration-role
  apiGroup: rbac.authorization.k8s.io
