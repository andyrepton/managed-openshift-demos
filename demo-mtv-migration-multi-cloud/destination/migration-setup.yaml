# Applied on the destination (ROSA) cluster, after the hetzner-source Secret
# exists (README step 5). The Provider registers the on-premises cluster as a
# migration source; the maps say where its networks and storage land on ROSA;
# plan.yaml then names the VM to move.
apiVersion: forklift.konveyor.io/v1beta1
kind: Provider
metadata:
  name: hetzner
  namespace: openshift-mtv
spec:
  type: openshift
  # Replaced with the source cluster's API URL in README step 5.
  url: REPLACE_ME_SOURCE_API_URL
  secret:
    name: hetzner-source
    namespace: openshift-mtv
---
apiVersion: forklift.konveyor.io/v1beta1
kind: NetworkMap
metadata:
  name: hetzner-to-rosa
  namespace: openshift-mtv
spec:
  provider:
    source:
      name: hetzner
      namespace: openshift-mtv
    destination:
      name: host
      namespace: openshift-mtv
  map:
  - source:
      type: pod
    destination:
      type: pod
---
apiVersion: forklift.konveyor.io/v1beta1
kind: StorageMap
metadata:
  name: hetzner-to-rosa
  namespace: openshift-mtv
spec:
  provider:
    source:
      name: hetzner
      namespace: openshift-mtv
    destination:
      name: host
      namespace: openshift-mtv
  map:
  - source:
      name: managed-nfs-storage
    destination:
      storageClass: gp3-csi
      accessMode: ReadWriteOnce
