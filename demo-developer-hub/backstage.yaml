apiVersion: v1
kind: Namespace
metadata:
  name: rhdh
---
apiVersion: rhdh.redhat.com/v1alpha5
kind: Backstage
metadata:
  name: developer-hub
  namespace: rhdh
spec:
  # The operator enables the `lightspeed` flavour by default (its metadata sets
  # enabledByDefault: true), which adds an init-rag-data init container and a
  # lightspeed-core sidecar to every pod. This demo is plain RHDH, so turn it off -
  # ../demo-rhdh-lightspeed-with-custom-mcp is the demo that enables it and gives it
  # a model to talk to.
  flavours:
    - name: lightspeed
      enabled: false

  database:
    # Operator-managed PostgreSQL. Fine for a demo; use an external database for
    # anything you care about keeping.
    enableLocalDb: true

  application:
    appConfig:
      configMaps:
        - name: app-config-rhdh

    dynamicPluginsConfigMapName: dynamic-plugins-rhdh

    extraEnvs:
      secrets:
        - name: rhdh-secrets

    route:
      enabled: true

  # Pin the ServiceAccount back to `default`.
  #
  # An earlier oauth-proxy experiment set this to a dedicated SA. Removing the
  # patch from this CR did NOT reset the field on the live Deployment - the
  # operator leaves it where it was - so deleting that SA left the Deployment
  # pointing at one that no longer existed and no pod could be created. Setting
  # it explicitly is what actually reverts it.
  deployment:
    patch:
      spec:
        template:
          spec:
            serviceAccountName: default
            # The deployment planner reads this cluster's OperatorHub to show
            # whether a requested operator is actually installable here. RHDH
            # mounts no token by default, so without this the plugin reports
            # every operator as "not checked" and says why.
            #
            # The token is only as useful as the SA's permissions, which are
            # get/list on packagemanifests in one namespace - see
            # ../demo-rhdh-cluster-planner/rbac/operator-catalog-reader.yaml.
            # Without that RoleBinding this line grants nothing.
            automountServiceAccountToken: true
            # The Dev Spaces self-service plugin's own credential, from
            # ../demo-rhdh-devspaces-self-service/rbac/provisioner.yaml.
            #
            # Mounted separately rather than granting the pod's `default`
            # ServiceAccount the right to create namespaces, which would give
            # that right to every other plugin sharing this pod.
            volumes:
              - name: devspaces-provisioner-token
                secret:
                  secretName: devspaces-provisioner-token
            containers:
              - name: backstage-backend
                volumeMounts:
                  - name: devspaces-provisioner-token
                    mountPath: /var/run/secrets/devspaces-provisioner
                    readOnly: true

