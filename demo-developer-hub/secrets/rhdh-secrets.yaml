# Placeholders only - replace REPLACE_ME before applying, and do NOT commit a
# filled-in copy.
#
# There is deliberately NO GitHub personal access token here. The catalog is read
# from a public repo unauthenticated and this demo performs no git write.
#
# GITHUB_APP_CLIENT_ID / GITHUB_APP_CLIENT_SECRET are different: they belong to a
# GitHub App used only to sign users in. They grant no repository access.
#
# Generate BACKEND_SECRET and SESSION_SECRET with:
#   openssl rand -base64 24
#
# Preferred: create it from the CLI so nothing sensitive lands on disk in the repo.
#
#   oc -n rhdh create secret generic rhdh-secrets \
#     --from-literal=BACKEND_SECRET="$(openssl rand -base64 24)" \
#     --from-literal=SESSION_SECRET="$(openssl rand -base64 24)" \
#     --from-literal=GITHUB_APP_CLIENT_ID="${GITHUB_APP_CLIENT_ID}" \
#     --from-literal=GITHUB_APP_CLIENT_SECRET="${GITHUB_APP_CLIENT_SECRET}" \
#     --from-literal=GITHUB_ORG="andyrepton" \
#     --from-literal=GITHUB_REPO="managed-openshift-demos" \
#     --from-literal=CATALOG_BRANCH="main"
---
apiVersion: v1
kind: Secret
metadata:
  name: rhdh-secrets
  namespace: rhdh
type: Opaque
stringData:
  BACKEND_SECRET: "REPLACE_ME"
  # Required by the GitHub auth provider.
  SESSION_SECRET: "REPLACE_ME"
  # From the GitHub App used for sign-in. Not a personal access token.
  GITHUB_APP_CLIENT_ID: "REPLACE_ME"
  GITHUB_APP_CLIENT_SECRET: "REPLACE_ME"
  GITHUB_ORG: "andyrepton"
  GITHUB_REPO: "managed-openshift-demos"
  # Branch the catalog is read from.
  CATALOG_BRANCH: "main"
