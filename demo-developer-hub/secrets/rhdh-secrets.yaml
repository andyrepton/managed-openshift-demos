# Placeholders only - replace the REPLACE_ME values before applying, and do NOT
# commit the filled-in version.
#
# Generate BACKEND_SECRET with:
#   node -p 'require("crypto").randomBytes(24).toString("base64")'
#   # or: openssl rand -base64 24
#
# GITHUB_TOKEN needs `repo` and `workflow` scopes so the Scaffolder can open PRs.
#
# Preferred alternative: create these from the CLI instead of a file, so nothing
# sensitive is ever written to disk in the repo:
#
#   oc -n rhdh create secret generic rhdh-secrets \
#     --from-literal=BACKEND_SECRET="$(openssl rand -base64 24)" \
#     --from-literal=GITHUB_TOKEN="${GITHUB_TOKEN}" \
#     --from-literal=GITHUB_ORG="andyrepton" \
#     --from-literal=GITHUB_REPO="managed-openshift-demos" \
#     --from-literal=CATALOG_BRANCH="main"
---
apiVersion: v1
kind: Secret
metadata:
  name: rhdh-secrets
  namespace: rhdh
type: Opaque
stringData:
  BACKEND_SECRET: "REPLACE_ME"
  GITHUB_TOKEN: "REPLACE_ME"
  GITHUB_ORG: "andyrepton"
  GITHUB_REPO: "managed-openshift-demos"
  # Branch the catalog is read from. Use a feature branch to verify changes pre-merge.
  CATALOG_BRANCH: "main"
