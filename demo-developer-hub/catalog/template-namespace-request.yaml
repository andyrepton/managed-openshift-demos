# A deliberately small template whose only job is to prove the golden path works:
# form -> rendered files -> GitHub PR -> catalog registration.
#
# If this runs end to end, the GitHub integration, the Scaffolder and the catalog are
# all wired correctly, which is the prerequisite for everything in
# demo-aro-cluster-planner.
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: namespace-request
  title: Request a namespace
  description: Raise a PR adding a namespace and a default-deny NetworkPolicy for your team
  tags:
    - openshift
    - onboarding
spec:
  owner: platform-team
  type: service

  parameters:
    - title: Namespace details
      required:
        - namespaceName
        - owner
      properties:
        namespaceName:
          title: Namespace name
          type: string
          description: Lower-case DNS label, e.g. payments-dev
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 63
          ui:autofocus: true
        owner:
          title: Owning team
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        description:
          title: What is this namespace for?
          type: string

    - title: Where should the PR go?
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Target repository
          type: string
          description: The repository the platform team reviews namespace requests in
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: render
      name: Render the manifests
      action: fetch:template
      input:
        url: ./skeleton
        values:
          namespaceName: ${{ parameters.namespaceName }}
          owner: ${{ parameters.owner }}
          description: ${{ parameters.description }}

    - id: pr
      name: Open a pull request
      action: publish:github:pull-request
      input:
        repoUrl: ${{ parameters.repoUrl }}
        branchName: namespace-request-${{ parameters.namespaceName }}
        title: "Add namespace ${{ parameters.namespaceName }}"
        description: |
          Raised from Red Hat Developer Hub by the `namespace-request` template.

          Owner: `${{ parameters.owner }}`
        targetPath: requested-namespaces/${{ parameters.namespaceName }}

  output:
    links:
      - title: Review the pull request
        url: ${{ steps.pr.output.remoteUrl }}
