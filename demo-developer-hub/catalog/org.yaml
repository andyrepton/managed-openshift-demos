# Who may sign in.
#
# app-config uses the `usernameMatchingUserEntityName` resolver, so a GitHub login
# only succeeds if a User entity here has the same name. GitHub OAuth on its own
# would let ANY GitHub account authenticate; this file is what prevents that.
# Adding a person to this file grants them access.
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: andyrepton
spec:
  profile:
    displayName: Andy Repton
  memberOf: [platform-team]
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: devoops0
spec:
  profile:
    displayName: Philipp
  memberOf: [platform-team]
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: mmusaji
spec:
  profile:
    displayName: Mustafa Musaji
  memberOf: [platform-team]
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: lbac-redhat
spec:
  memberOf: [platform-team]
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform-team
  description: Owns the managed OpenShift platform and reviews cluster requests
spec:
  type: team
  children: []
  members: [andyrepton, devoops0, mmusaji, lbac-redhat]
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: payments-team
  description: Example application team - the sort of team that would request a cluster
spec:
  type: team
  children: []
