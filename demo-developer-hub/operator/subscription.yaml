# RHDH 2.1 ships in the standard `redhat-operators` catalog, so no CatalogSource is
# needed - OpenShift already has it.
apiVersion: v1
kind: Namespace
metadata:
  name: rhdh-operator
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: rhdh-operator-group
  namespace: rhdh-operator
spec:
  # Empty targetNamespaces = all namespaces, so one operator can manage Backstage CRs
  # in whichever namespace you put them.
  targetNamespaces: []
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhdh
  namespace: rhdh-operator
spec:
  # `fast-2.1` rather than `fast`: it pins to the 2.1 stream, so the cluster
  # takes 2.1 patch releases but does not jump to the next minor (which can
  # carry breaking changes, as 1.10 to 2.1 did) on its own.
  channel: fast-2.1
  name: rhdh
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
