apiVersion: v1
kind: ConfigMap
metadata:
  name: dynamic-plugins-rhdh
  namespace: rhdh
data:
  dynamic-plugins.yaml: |
    # Start from the set RHDH ships enabled by default, then add to it.
    includes:
      - dynamic-plugins.default.yaml
    plugins:
      # Disabled deliberately. This provides the `publish:github:*` Scaffolder
      # actions, which need a stored GitHub token to do anything. With guest
      # sign-in enabled there is no credential here for an anonymous visitor to
      # drive, and these actions are what would change that.
      #
      # Note RHDH ships this disabled by default anyway; re-enabling it means
      # `disabled: false` AND a token, and so means turning guest sign-in off.
      - package: ./dynamic-plugins/dist/backstage-plugin-scaffolder-backend-module-github-dynamic
        disabled: true

      # GitHub catalog discovery. Not needed here - the catalog/ locations in
      # app-config cover it - but this is the usual next step, so it is present and
      # disabled rather than absent.
      - package: ./dynamic-plugins/dist/backstage-plugin-catalog-backend-module-github-dynamic
        disabled: true
        pluginConfig:
          catalog:
            providers:
              github:
                myorg:
                  organization: '${GITHUB_ORG}'
                  schedule:
                    frequency: { minutes: 30 }
                    timeout: { minutes: 3 }
                    initialDelay: { seconds: 15 }

      # ARO cluster planner, from ../demo-aro-cluster-planner. Two plugins ship in
      # one registry image: the backend serves /api/aro-planner (the Azure Retail
      # Prices API sends no CORS headers, so pricing must happen server-side), and
      # the frontend provides the wizard page and the Scaffolder field.
      #
      # The `!<plugin-path>` suffix names the plugin inside the image explicitly.
      # Without it RHDH auto-detects the path from the `io.backstage.dynamic-packages`
      # OCI manifest annotation, which an ordinary OpenShift build cannot set.
      #
      # The key under dynamicPlugins.frontend MUST equal `scalprum.name` from the
      # plugin's package.json, or the plugin is discovered but never loaded.
      - package: 'oci://quay.io/andyrepton/rhdh-plugins:aro-planner-1.5.8!aro-planner-backstage-plugin-aro-planner-backend'
        disabled: false

      - package: 'oci://quay.io/andyrepton/rhdh-plugins:aro-planner-1.5.8!aro-planner-backstage-plugin-aro-planner'
        disabled: false
        pluginConfig:
          dynamicPlugins:
            frontend:
              aro-planner.backstage-plugin-aro-planner:
                # No appIcons entry. `importName` under appIcons must name an icon
                # component; pointing it at AroPlannerPage makes RHDH render the
                # whole wizard inside the sidebar. `icon` below names a built-in.
                dynamicRoutes:
                  - path: /deployment-planner
                    importName: AroPlannerPage
                    menuItem:
                      icon: category
                      text: Deployment Planner
                scaffolderFieldExtensions:
                  - importName: AroClusterPlannerFieldExtension

      # Dev Spaces self-service, from ../demo-rhdh-devspaces-self-service.
      #
      # Unlike the planner, the backend here WRITES to the cluster: it creates
      # a namespace, a quota and a limit range for the signed-in user. That
      # needs a ServiceAccount with those permissions, which is not the one
      # RHDH runs as by default - apply
      # ../demo-rhdh-devspaces-self-service/rbac/provisioner.yaml first.
      #
      # It refuses guest and anonymous callers outright rather than relying on
      # auth.environment staying as it is, since guest sign-in is an
      # installation-wide switch another demo could flip.
      - package: 'oci://quay.io/andyrepton/rhdh-plugins:devspaces-self-service-0.1.2!devspaces-backstage-plugin-devspaces-self-service-backend'
        disabled: false

      - package: 'oci://quay.io/andyrepton/rhdh-plugins:devspaces-self-service-0.1.2!devspaces-backstage-plugin-devspaces-self-service'
        disabled: false
        pluginConfig:
          dynamicPlugins:
            frontend:
              devspaces-self-service.backstage-plugin-devspaces-self-service:
                dynamicRoutes:
                  - path: /devspaces-self-service
                    importName: DevSpacesSelfServicePage
                    menuItem:
                      icon: code
                      text: Request a Dev Space
