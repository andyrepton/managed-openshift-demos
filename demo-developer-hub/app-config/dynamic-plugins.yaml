apiVersion: v1
kind: ConfigMap
metadata:
  name: dynamic-plugins-rhdh
  namespace: rhdh
data:
  dynamic-plugins.yaml: |
    # Start from the set RHDH ships enabled by default, then add to it.
    includes:
      - dynamic-plugins.default.yaml
    plugins:
      # Disabled deliberately. This provides the `publish:github:*` Scaffolder
      # actions, which need a stored GitHub token to do anything. With guest
      # sign-in enabled there is no credential here for an anonymous visitor to
      # drive, and these actions are what would change that.
      #
      # Note RHDH ships this disabled by default anyway; re-enabling it means
      # `disabled: false` AND a token, and so means turning guest sign-in off.
      - package: ./dynamic-plugins/dist/backstage-plugin-scaffolder-backend-module-github-dynamic
        disabled: true

      # GitHub catalog discovery. Not needed here - the catalog/ locations in
      # app-config cover it - but this is the usual next step, so it is present and
      # disabled rather than absent.
      - package: ./dynamic-plugins/dist/backstage-plugin-catalog-backend-module-github-dynamic
        disabled: true
        pluginConfig:
          catalog:
            providers:
              github:
                myorg:
                  organization: '${GITHUB_ORG}'
                  schedule:
                    frequency: { minutes: 30 }
                    timeout: { minutes: 3 }
                    initialDelay: { seconds: 15 }

    # Plugins from other demos are NOT listed here.
    #
    # They used to be, and it made this demo undeployable on its own: the
    # installer runs as an init container with no top-level exception handler,
    # so an image it cannot pull is not a missing plugin, it is a pod stuck in
    # Init:Error. Anyone deploying just this demo got a Developer Hub that
    # never started, because of two plugins they had never built.
    #
    # Each plugin demo now owns its own entry and composes it in:
    #
    #   python3 -I scripts/compose-dynamic-plugins.py \
    #     ../demo-rhdh-cluster-planner/rhdh/dynamic-plugins-entry.yaml \
    #     ../demo-rhdh-devspaces-self-service/rhdh/dynamic-plugins-entry.yaml \
    #     --apply
    #
    # With no arguments that script reproduces exactly this file, so deploying
    # the base demo alone needs nothing extra.
