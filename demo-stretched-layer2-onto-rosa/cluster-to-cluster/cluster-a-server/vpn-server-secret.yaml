# OpenVPN server configuration for Cluster A hub.
apiVersion: v1
kind: Secret
metadata:
  name: vpn-server-config
  namespace: industrial-network
type: Opaque
stringData:
  server.conf: |
    dev tap
    proto udp
    port 1194
    ca /etc/openvpn/certs/ca.crt
    cert /etc/openvpn/certs/server.crt
    key /etc/openvpn/certs/server.key
    dh /etc/openvpn/certs/dh.pem
    server-bridge 192.168.100.1 255.255.255.0 192.168.100.10 192.168.100.20
    keepalive 10 120
    cipher AES-256-GCM
    persist-key
    persist-tun
    status /tmp/openvpn-status.log
    verb 3
---
# The cert secret 'vpn-server-auth' must be created manually:
#
#   oc create secret generic vpn-server-auth \
#     --from-file=ca.crt=ca.crt \
#     --from-file=server.crt=server.crt \
#     --from-file=server.key=server.key \
#     --from-file=dh.pem=dh.pem \
#     -n industrial-network
