apiVersion: apps/v1
kind: Deployment
metadata:
  name: industrial-hub
  namespace: industrial-network
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: industrial-hub
  template:
    metadata:
      labels:
        app: industrial-hub
    spec:
      hostNetwork: true
      nodeSelector:
        industrial-role: hub
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: industrial-admin
      containers:
      - name: gateway
        image: image-registry.openshift-image-registry.svc:5000/industrial-network/industrial-networking-tools:latest
        securityContext:
          privileged: true
        command: ["/bin/sh", "-c"]
        args:
          - |
            # 1. Clean up stale interfaces from previous hostNetwork runs
            ip link delete tap0 2>/dev/null
            ip link delete br-hub 2>/dev/null
            ip link delete vxlan-hub 2>/dev/null

            # 2. Initialize the Hub Bridge
            ip link add br-hub type bridge
            ip link set br-hub up
            ip addr add 192.168.100.1/24 dev br-hub 2>/dev/null

            # 3. Setup VXLAN (VNI 100)
            PRIMARY_IF=$(ip route | grep default | awk '{print $5}' | head -n1)
            ip link add vxlan-hub type vxlan id 100 dev $PRIMARY_IF dstport 4789 nolearning
            ip link set vxlan-hub master br-hub
            ip link set vxlan-hub up

            # 4. Security: Allow foreign MACs + disable reverse path filtering
            ip link set $PRIMARY_IF promisc on
            ip link set br-hub promisc on
            echo 0 > /proc/sys/net/ipv4/conf/all/rp_filter
            echo 0 > /proc/sys/net/ipv4/conf/br-hub/rp_filter

            # 5. Plug OpenVPN tap0 into bridge once alive
            (
              until ip link show tap0 2>/dev/null; do sleep 2; done
              ip link set tap0 master br-hub
              ip link set tap0 up
              ip link set tap0 promisc on
              echo 0 > /proc/sys/net/ipv4/conf/tap0/rp_filter
              # server-bridge assigns the gateway IP to tap0 — remove it since
              # tap0 is a bridge slave and the IP belongs on br-hub
              sleep 5
              TAP_IP=$(ip -4 addr show tap0 | grep -oP '(?<=inet\s)\d+(\.\d+){3}')
              if [ -n "$TAP_IP" ]; then
                ip addr del $TAP_IP/24 dev tap0 2>/dev/null
                echo "Removed $TAP_IP from tap0 (bridge slave)"
              fi
              echo "--- L2 BRIDGE LINKED (tap0 <-> br-hub <-> vxlan-hub) ---"
            ) &

            # 6. Discover spoke node IPs and add VXLAN FDB entries
            (
              KUBE_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              KUBE_CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              MY_NODE_IP=$(ip -4 addr show $PRIMARY_IF | grep -oP '(?<=inet\s)\d+(\.\d+){3}')
              API_URL="https://kubernetes.default.svc/api/v1/namespaces/industrial-network/pods?labelSelector=app%3Dindustrial-spoke"

              while true; do
                SPOKE_IPS=$(curl --cacert $KUBE_CA \
                  -H "Authorization: Bearer $KUBE_TOKEN" \
                  -s "$API_URL" | grep -oP '"hostIP"\s*:\s*"\K[^"]+' | sort -u)

                for IP in $SPOKE_IPS; do
                  if [ "$IP" != "$MY_NODE_IP" ]; then
                    bridge fdb append 00:00:00:00:00:00 dev vxlan-hub dst $IP 2>/dev/null
                    echo "FDB entry ensured for spoke at $IP"
                  fi
                done

                # Remove FDB entries for nodes that no longer run spokes
                CURRENT_FDB=$(bridge fdb show dev vxlan-hub | grep "00:00:00:00:00:00" | grep -oP 'dst \K\S+')
                for FDB_IP in $CURRENT_FDB; do
                  FOUND=false
                  for IP in $SPOKE_IPS; do
                    [ "$IP" = "$FDB_IP" ] && FOUND=true && break
                  done
                  if [ "$FOUND" = "false" ]; then
                    bridge fdb del 00:00:00:00:00:00 dev vxlan-hub dst $FDB_IP 2>/dev/null
                    echo "Removed stale FDB entry for $FDB_IP"
                  fi
                done
                sleep 30
              done
            ) &

            # 7. Start OpenVPN SERVER (foreground — --daemon silently dies in containers)
            echo "HUB READY (VPN SERVER) - IP 192.168.100.1"
            openvpn --config /etc/openvpn/config/server.conf
        volumeMounts:
        - name: vpn-config
          mountPath: /etc/openvpn/config
        - name: vpn-certs
          mountPath: /etc/openvpn/certs
      volumes:
      - name: vpn-config
        secret:
          secretName: vpn-server-config
      - name: vpn-certs
        secret:
          secretName: vpn-server-auth
