# OpenVPN client configuration for Cluster B hub.
# Set 'remote' to Cluster A's LoadBalancer or public IP.
apiVersion: v1
kind: Secret
metadata:
  name: vpn-client-config
  namespace: industrial-network
type: Opaque
stringData:
  client.conf: |
    client
    dev tap
    proto udp
    remote REPLACE_ME_CLUSTER_A_VPN_HOST 1194
    resolv-retry infinite
    nobind
    persist-key
    persist-tun

    ca /etc/openvpn/certs/ca.crt
    cert /etc/openvpn/certs/client.crt
    key /etc/openvpn/certs/client.key

    remote-cert-tls server
    cipher AES-256-GCM
    verb 3

    status /tmp/openvpn-status.log
---
# The cert secret 'vpn-client-auth' must be created manually:
#
#   oc create secret generic vpn-client-auth \
#     --from-file=ca.crt=ca.crt \
#     --from-file=client.crt=client.crt \
#     --from-file=client.key=client.key \
#     -n industrial-network
