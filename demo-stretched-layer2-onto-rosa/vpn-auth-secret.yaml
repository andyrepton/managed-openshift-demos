# VPN client configuration — update the 'remote' line to point at your
# factory VPN server (or the in-cluster simulator for testing).
apiVersion: v1
kind: Secret
metadata:
  name: factory-vpn-config
  namespace: industrial-network
type: Opaque
stringData:
  client.conf: |
    client
    dev tap
    proto udp
    # For simulator testing, use the in-cluster service:
    #   remote vpn-server-svc.factory-simulator.svc.cluster.local 1194
    # For real deployments, point to the factory VPN endpoint:
    remote REPLACE_ME_VPN_HOST 1194
    resolv-retry infinite
    nobind
    persist-key
    persist-tun

    ca /etc/openvpn/certs/ca.crt
    cert /etc/openvpn/certs/client.crt
    key /etc/openvpn/certs/client.key

    remote-cert-tls server
    cipher AES-256-GCM
    verb 3

    status /tmp/openvpn-status.log
---
# The cert secret 'factory-vpn-auth' must be created manually with your
# generated PKI files (never commit real certs to git). Create it with:
#
#   oc create secret generic factory-vpn-auth \
#     --from-file=ca.crt=ca.crt \
#     --from-file=client.crt=client.crt \
#     --from-file=client.key=client.key \
#     -n industrial-network
#
# For the simulator test, the reset_lab.sh script handles this automatically.
