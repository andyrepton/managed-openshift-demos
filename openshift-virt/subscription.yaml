apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: hco-operatorhub
  namespace: openshift-cnv
spec:
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  name: kubevirt-hyperconverged
  # No startingCSV: the stable channel resolves to the build matching the
  # cluster. Pinning a version the cluster's catalog no longer carries leaves
  # the subscription unresolved and the operator never installs.
  channel: "stable"
