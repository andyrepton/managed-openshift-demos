apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mtv-cclm-role
rules:
- apiGroups: ["forklift.konveyor.io"]
  resources: ["*"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets", "namespaces", "configmaps", "persistentvolumes",
              "persistentvolumeclaims", "pods", "services", "endpoints"]
  verbs: ["get", "list", "watch", "create", "patch", "delete"]
- apiGroups: ["kubevirt.io"]
  resources: ["virtualmachines", "virtualmachineinstances",
              "virtualmachineinstancemigrations"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["instancetype.kubevirt.io"]
  resources: ["virtualmachineinstancetypes", "virtualmachineclusterinstancetypes",
              "virtualmachinepreferences", "virtualmachineclusterpreferences"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: ["cdi.kubevirt.io"]
  resources: ["datavolumes", "datasources", "dataimportcrons"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: ["k8s.cni.cncf.io"]
  resources: ["network-attachment-definitions"]
  verbs: ["get", "list", "watch", "create"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch", "create", "update"]
- apiGroups: ["export.kubevirt.io"]
  resources: ["virtualmachineexports"]
  verbs: ["get", "list", "watch", "create"]
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclasses"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["subresources.kubevirt.io"]
  resources: ["virtualmachineinstances/vnc", "virtualmachineinstances/console",
              "virtualmachineinstances/pause", "virtualmachineinstances/unpause"]
  verbs: ["get", "update"]
