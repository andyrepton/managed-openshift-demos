apiVersion: forklift.konveyor.io/v1beta1
kind: Plan
metadata:
  name: cclm-hetzner-to-rosa
  namespace: openshift-mtv
spec:
  provider:
    source:
      name: hetzner-cluster
      namespace: openshift-mtv
    destination:
      name: host
      namespace: openshift-mtv
  map:
