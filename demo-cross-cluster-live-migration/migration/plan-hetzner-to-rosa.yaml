      name: cclm-netmap-hetzner-to-rosa
      namespace: openshift-mtv
    storage:
      name: cclm-storagemap-hetzner-to-rosa
      namespace: openshift-mtv
  targetNamespace: industrial-spoke
  liveMigrate: true
  vms:
    - name: cclm-test-vm
      namespace: industrial-spoke
