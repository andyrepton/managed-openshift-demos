apiVersion: v1
kind: Namespace
metadata:
  name: vms-red
  labels:
    # Both labels must be present at creation time. OCP admission refuses to
    # add the primary-user-defined-network label to a namespace that exists.
    k8s.ovn.org/primary-user-defined-network: ""
    cluster-udn: red
---
apiVersion: v1
kind: Namespace
metadata:
  name: vms-blue
  labels:
    k8s.ovn.org/primary-user-defined-network: ""
    cluster-udn: blue
