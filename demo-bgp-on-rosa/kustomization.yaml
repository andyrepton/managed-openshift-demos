apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# cudn.yaml is deliberately absent: the operator creates the CUDN for each
# BGPRouting itself (cluster-udn-<name>). A hand-written CUDN selecting the
# same namespaces collides with it.
resources:
  - bgp-cloud-configuration.yaml
  - namespace.yaml
  - bgp-routing.yaml
  - test-pod.yaml
  - test-vm.yaml
