# One Fedora VM per network, each serving a page over HTTP so you can prove
# reachability from the VPC and isolation between the two networks.
#
# The l2bridge binding is required. In a primary-UDN namespace the VM attaches
# to the UDN interface (ovn-udn1), and the masquerade binding installs nftables
# rules in the virt-launcher pod that drop inbound traffic on that interface —
# the VM would be unreachable from outside even though BGP advertises its
# subnet correctly. l2bridge is the default for primary UDNs and needs no
# HyperConverged configuration.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: vm-red
  namespace: vms-red
  labels:
    app: vm-red
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app: vm-red
    spec:
      # ROSA runs OpenShift Virtualization on bare-metal instances only; this
      # is the same m5.metal node that carries the BGP session.
      nodeSelector:
        bgp_router: "true"
      domain:
        resources:
          requests:
            memory: 1Gi
        devices:
          disks:
            - name: containerdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              binding:
                name: l2bridge
      networks:
        - name: default
          pod: {}
      volumes:
        - name: containerdisk
          containerDisk:
            image: quay.io/containerdisks/fedora:latest
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              password: fedora
              chpasswd:
                expire: false
              packages:
                - httpd
              runcmd:
                - systemctl enable httpd
                - systemctl start httpd
                - echo 'red network - CUDN cluster-udn-red - 10.100.0.0/16' > /var/www/html/index.html
---
