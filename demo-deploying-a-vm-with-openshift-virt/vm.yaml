# A Fedora VM for the command-line path, built the way the console's
# "From InstanceType" wizard builds one: its disk is cloned from the Fedora
# golden image that OpenShift Virtualization keeps in
# openshift-virtualization-os-images, and its size comes from the u1.small
# instance type.
apiVersion: v1
kind: Namespace
metadata:
  name: vm-demo
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: fedora-demo
  namespace: vm-demo
spec:
  runStrategy: Always
  instancetype:
    kind: VirtualMachineClusterInstancetype
    name: u1.small
  preference:
    kind: VirtualMachineClusterPreference
    name: fedora
  dataVolumeTemplates:
  - metadata:
      name: fedora-demo-disk
    spec:
      sourceRef:
        kind: DataSource
        name: fedora
        namespace: openshift-virtualization-os-images
      storage:
        resources:
          requests:
            storage: 30Gi
  template:
    spec:
      domain:
        devices: {}
      volumes:
      - name: rootdisk
        dataVolume:
          name: fedora-demo-disk
