# Grant Lightspeed access to specific AD groups.
# The operator creates the lightspeed-operator-query-access ClusterRole but does
# not bind it to any users or groups by default.
#
# Option 1: Bind specific AD groups (recommended)
# Duplicate the binding below for each group that needs access.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lightspeed-users-ad-group
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lightspeed-operator-query-access
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: REPLACE_WITH_GROUP # group name (must match the group claim from your IDP)
---
