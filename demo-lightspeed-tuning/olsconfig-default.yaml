apiVersion: ols.openshift.io/v1alpha1
kind: OLSConfig
metadata:
  name: cluster
spec:
  llm:
    providers:
      - name: rhoai-maas
        type: openai
        # MaaS gateway endpoint on the RHOAI cluster (OpenAI-compatible API)
        url: REPLACE_WITH_ENDPOINT_URL
        credentialsSecretRef:
          name: llm-credentials
        models:
          - name: REPLACE_WITH_MODEL_NAME
            contextWindowSize: 32768
            parameters:
              maxTokensForResponse: 2048
  ols:
    defaultModel: REPLACE_WITH_MODEL_NAME
    defaultProvider: rhoai-maas
    logLevel: INFO
    introspectionEnabled: true
    conversationCache:
      type: postgres
      postgres:
        sharedBuffers: 256MB
        maxConnections: 2000
  featureGates:
    - MCPServer
