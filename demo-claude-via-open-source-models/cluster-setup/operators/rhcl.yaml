# Duplicate of ../../maas/operator.yaml, applied here in Step 2 on purpose:
# installing RHCL before KServe's llmisvc-controller-manager starts avoided
# "AuthPolicy CRD not available" on LLMInferenceServices in September 2026
# testing (the controller cached CRD discovery). Not needed on RHOAI 3.5.2.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhcl-operator
  namespace: openshift-operators
spec:
  channel: stable
  installPlanApproval: Automatic
  name: rhcl-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
