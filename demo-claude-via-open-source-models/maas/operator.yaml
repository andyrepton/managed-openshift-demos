# Duplicate of ../cluster-setup/operators/rhcl.yaml. The main README installs
# RHCL from that copy in Step 2, early, for install ordering; this copy keeps
# the maas/ guide self-contained.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhcl-operator
  namespace: openshift-operators
spec:
