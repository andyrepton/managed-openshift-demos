# MaaSSubscription grants access to models with token limits.
#
# On ROSA/OCP, add users to an OpenShift group:
#   oc adm groups new claude-code-users
#   oc adm groups add-users claude-code-users alice bob charlie
#
# On ARO HCP, OpenShift groups are not available (Entra ID auth).
# Use the users field instead — add individual usernames or ServiceAccount
# identities (e.g. system:serviceaccount:claude-code-demo:maas-client).
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: claude-code-demo-subscription
  namespace: models-as-a-service
spec:
  owner:
    groups:
      - name: claude-code-users
    # On ARO HCP, uncomment and add your users here:
    # users:
    #   - system:serviceaccount:claude-code-demo:maas-client
  modelRefs:
    - name: granite-4-1-30b
      namespace: claude-code-demo
      billingRate:
        perToken: "0.0001"
      tokenRateLimits:
        - limit: 100000000
          window: "1h"
    - name: qwen3-8-27b
      namespace: claude-code-demo
      billingRate:
        perToken: "0.0001"
      tokenRateLimits:
        - limit: 100000000
          window: "1h"
  priority: 10
