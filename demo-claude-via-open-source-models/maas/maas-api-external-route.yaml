apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: maas-api-external
  namespace: openshift-ingress
  annotations:
    # Without this, the router's default 30s timeout kills non-streaming requests
    # waiting for a long model response (504 at exactly 30s). Streaming requests
    # are unaffected because tokens keep the connection active.
    haproxy.router.openshift.io/timeout: 10m
spec:
  host: maas.apps.rosa.poc-andyr.cqul.p3.openshiftapps.com
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: maas-default-gateway-data-science-gateway-class
    weight: 100
