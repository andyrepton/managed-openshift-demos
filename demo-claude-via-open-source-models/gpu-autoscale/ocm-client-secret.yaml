# Template only — do NOT commit real credentials.
#
# Create the real secret imperatively instead, after building the OCM API
# client:
#
#   oc -n claude-code-demo create secret generic ocm-client \
#     --from-literal=client-id=<CLIENT_ID> \
#     --from-literal=client-secret=<CLIENT_SECRET>
#
# The client id/secret are mounted as OCM_CLIENT_ID / OCM_CLIENT_SECRET env
# vars in the CronJobs below.

apiVersion: v1
kind: Secret
metadata:
  name: ocm-client
  namespace: claude-code-demo
type: Opaque
stringData:
  client-id: REPLACE_WITH_OCM_CLIENT_ID
  client-secret: REPLACE_WITH_OCM_CLIENT_SECRET