# Scale the GPU machine pool back to 2 in the morning.
#
# Runs early (06:15) because scale-up can take 10-20 min of node provisioning
# (plus model warm-up) before the demo is usable. If g7e capacity is short in
# the AZ at that time, the job exits 1 and Kubernetes retries it on the next
# schedule tick.
#
# Schedules use the cluster's timezone (typically UTC on ROSA). Adjust for
# your local time before applying.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gpu-pool-scale-up
  namespace: claude-code-demo
  labels:
    app.kubernetes.io/name: gpu-pool-scaler
    app.kubernetes.io/component: scale-up
spec:
  schedule: "15 6 * * *"     # 06:15 daily — verify cluster timezone first
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 10
  jobTemplate:
    spec:
      backoffLimit: 2        # g7e capacity can be flaky; allow retries
      activeDeadlineSeconds: 2400   # 40 min: provisioning + up to 30 min polling
      template:
        spec:
          restartPolicy: Never
          # Placeholder — replace with your built + pushed image
          # (docker buildx build --platform linux/amd64 -t quay.io/<your-org>/gpu-pool-scaler:latest ...)
          image: quay.io/REPLACE_WITH_YOUR_ORG/gpu-pool-scaler:latest
          imagePullPolicy: IfNotPresent
          containers:
            - name: scaler
              env:
                # Client credentials (preferred) or offline token — whichever
                # keys exist in the ocm-client Secret. optional: true so the
                # pod starts whether the Secret uses one shape or the other.
                - name: OCM_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: ocm-client
                      key: client-id
                      optional: true
                - name: OCM_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: ocm-client
                      key: client-secret
                      optional: true
                - name: OCM_OFFLINE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: ocm-client
                      key: offline-token
                      optional: true
                - name: CLUSTER_ID
                  value: "2se5gi3k8ssrahi8iatg5arudlomk9rp"
                - name: POOL_NAME
                  value: "poc-andyr-gpu"
                - name: TARGET_REPLICAS
                  value: "2"
                - name: POLL_INTERVAL_SECONDS
                  value: "120"
                - name: MAX_ATTEMPTS
                  value: "15"
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi