apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: litellm-gateway
  namespace: claude-code-demo
  labels:
    app: litellm-gateway
  annotations:
    haproxy.router.openshift.io/timeout: 10m
spec:
  to:
    kind: Service
    name: litellm-gateway
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
