apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  annotations:
    openshift.io/display-name: Granite 4.1 30B
    serving.kserve.io/deploymentMode: RawDeployment
  name: granite-4-1-30b
  namespace: claude-code-demo
  labels:
    opendatahub.io/dashboard: "true"
spec:
  predictor:
    maxReplicas: 1
    minReplicas: 1
    model:
      args:
        - --max-model-len
        - "131072"
        - --quantization
        - fp8
        - --enable-auto-tool-choice
        - --tool-call-parser
        - granite4
      modelFormat:
        name: vLLM
      name: ""
      resources:
        limits:
          cpu: "4"
          memory: 16Gi
          nvidia.com/gpu: "1"
        requests:
          cpu: "2"
          memory: 8Gi
          nvidia.com/gpu: "1"
      runtime: vllm-cuda-runtime
      storageUri: pvc://granite-4-1-30b-model-storage/granite-4-1-30b
    tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Exists
