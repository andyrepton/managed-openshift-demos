apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: granite-4-1-30b
  namespace: claude-code-demo
  annotations:
    openshift.io/display-name: Granite 4.1 30B
  labels:
    opendatahub.io/dashboard: "true"
spec:
  model:
    uri: pvc://granite-4-1-30b-model-storage/granite-4-1-30b
    name: granite-4-1-30b
  baseRefs:
    - name: v3-5-0-kserve-config-llm-template-nvidia-cuda
    - name: v3-5-0-kserve-config-llm-router-route
  router:
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
  replicas: 1
  template:
    containers:
      - name: main
        image: registry.redhat.io/rhaii/vllm-cuda-rhel9:3.5.0
        args:
          - --max-model-len=131072
          - --quantization=fp8
          - --enable-auto-tool-choice
          - --tool-call-parser=granite4
          - --served-model-name=claude-sonnet-5
          - --served-model-name=claude-sonnet-4-20250514
          - --served-model-name=claude-sonnet-5-20250219
          - --served-model-name=claude-3-5-sonnet-20241022
          - --served-model-name=claude-haiku-4-5-20251001
          - --served-model-name=claude-3-5-haiku-20241022
          - --served-model-name=granite-4-1-30b
        env:
          - name: VLLM_USE_DEEP_GEMM
            value: "0"
        resources:
          limits:
            cpu: "4"
            memory: 16Gi
            nvidia.com/gpu: "1"
          requests:
            cpu: "2"
            memory: 8Gi
            nvidia.com/gpu: "1"
    tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Exists
