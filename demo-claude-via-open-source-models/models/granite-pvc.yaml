apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: granite-4-1-30b-model-storage
  namespace: claude-code-demo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi  # BF16 30B weights (~60GB) plus headroom for on-the-fly FP8 quantisation — do not shrink
