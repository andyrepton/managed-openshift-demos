# Permissions for the Dev Spaces self-service plugin.
#
# This is the only thing in this repo that lets RHDH create a namespace, so
# the scoping is the point and is worth reading before applying.
#
# APPLY rbac/provisioner-scope.yaml WITH THIS FILE. On its own, this grants
# every verb below in every namespace on the cluster; that file is what
# confines them to `<username>-devspaces`. Read its header before deciding to
# skip it.
#
# What it can do:
#   * create namespaces, resource quotas, limit ranges and workspaces
#   * write (not read) the one AI-credential Secret per namespace
#   * read the CheCluster, for the dashboard URL
#   * read one ConfigMap, for the list of tools baked into the UDI
#
# What it deliberately cannot do:
#   * DELETE anything. Removing a namespace is a human decision; the plugin
#     has no verb for it, so a bug in it cannot take one away.
#   * READ secrets. Write-only, for the reason given on that rule below.
#   * touch pods, deployments, nodes, RBAC or anything in another namespace's
#     workloads.
#   * escalate: no bind, no escalate, no impersonate. Without those a
#     ServiceAccount cannot grant itself more than it already has.
#
# Namespace creation cannot be restricted by name in RBAC - there is no
# resourceName matching on create, because the object does not exist yet. The
# plugin enforces the `<username>-devspaces` pattern itself, from the signed-in
# caller's identity rather than from the request body, and
# rbac/provisioner-scope.yaml enforces the same pattern at the API server so
# it holds even for a caller that is not the plugin. Three layers, because the
# credential is a file in a pod shared with other plugins.
#
# Everything the plugin creates is labelled
# app.kubernetes.io/managed-by=devspaces-self-service, so the whole blast
# radius is one selector away:
#
#   oc get ns -l app.kubernetes.io/managed-by=devspaces-self-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devspaces-provisioner
  namespace: rhdh
  labels:
    app.kubernetes.io/managed-by: devspaces-self-service
---
# A token for that ServiceAccount, mounted into the RHDH pod at its own path.
#
# RHDH runs as the `default` ServiceAccount, shared by every plugin in the
# pod. Granting `default` the right to create namespaces would grant it to all
# of them, so instead this token is mounted alongside and named in app-config
# under devspacesSelfService.credentialDir.
#
# This is a long-lived token rather than a projected one, because a projected
# `serviceAccountToken` volume can only project the pod's OWN ServiceAccount -
# there is no way to project a second one. The trade is a credential that does
# not rotate; it is bound to a ServiceAccount that can do four things in one
# namespace shape, and `oc delete secret` revokes it immediately.
apiVersion: v1
kind: Secret
metadata:
  name: devspaces-provisioner-token
  namespace: rhdh
  labels:
    app.kubernetes.io/managed-by: devspaces-self-service
  annotations:
    kubernetes.io/service-account.name: devspaces-provisioner
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: devspaces-self-service-provisioner
  labels:
    app.kubernetes.io/managed-by: devspaces-self-service
rules:
  # Namespaces. No delete: see the note above.
  - apiGroups: ['']
    resources: ['namespaces']
    verbs: ['get', 'list', 'create', 'patch', 'update']

  # The objects that make a namespace a bounded one. Without the quota and
  # the limit range this plugin would hand out unbounded namespaces, which is
  # the opposite of its purpose.
  - apiGroups: ['']
    resources: ['resourcequotas', 'limitranges']
    verbs: ['get', 'list', 'create', 'patch', 'update']

  # The AI credential, mounted into workspaces by Dev Spaces.
  #
  # Deliberately write-only. `get` is NOT here, and that is the one rule in
  # this file worth not relaxing: RBAC cannot scope a read to a namespace that
  # does not exist yet, so a `get` on secrets is a `get` on every Secret in
  # the cluster - every operator's credentials, every ServiceAccount token.
  # Combined with `create`, it was also an escalation rather than a
  # disclosure: create a Secret of type kubernetes.io/service-account-token
  # annotated for a privileged ServiceAccount, wait for the token controller,
  # read it back. That is exactly how this plugin's own token is issued a few
  # lines up, so it demonstrably works on this cluster.
  #
  # Server-side apply does not need `get` - the API server does the merge.
  # The only thing lost is the `created: true|false` flag that provision.ts
  # reports for the Secret: exists() turns the 403 into `false`, so a Secret
  # that was updated is reported as created. Cosmetic, and worth it.
  #
  # Writes are bounded to the devspaces-ai-credentials Secret in
  # <username>-devspaces by rbac/provisioner-scope.yaml. Apply that too.
  - apiGroups: ['']
    resources: ['secrets']
    verbs: ['create', 'patch']

  # Read-only, for the dashboard URL shown in the factory link.
  - apiGroups: ['org.eclipse.che']
    resources: ['checlusters']
    verbs: ['get', 'list']

  # The workspace itself, and the editor template it needs.
  #
  # Without these the plugin can create a namespace with a quota but not the
  # workspace that goes in it, and the assistant selection ends up in a
  # devfile nobody applies.
  #
  # Still no delete: a workspace is the user's, and Dev Spaces already gives
  # them a dashboard to remove it from. `patch` is needed for server-side
  # apply, which is also how a re-submitted request converges rather than
  # failing.
  #
  # This is the broadest rule here: a DevWorkspace runs a container image of
  # the submitter's choosing, so cluster-wide `create` would mean arbitrary
  # workloads in any namespace. rbac/provisioner-scope.yaml is what keeps it
  # to <username>-devspaces.
  - apiGroups: ['workspace.devfile.io']
    resources: ['devworkspaces', 'devworkspacetemplates']
    verbs: ['get', 'list', 'create', 'patch', 'update']

  # The container-build SCC. This is the sharpest grant in this file, and it
  # is not optional on a cluster configured like this one.
  #
  # The DevWorkspaceOperatorConfig adds SETGID, SETUID and
  # allowPrivilegeEscalation to EVERY workspace container, so `restricted-v2`
  # refuses the pod and no workspace starts. A workspace declares
  # `controller.devfile.io/scc: container-build`, which makes the controller
  # grant the workspace's own ServiceAccount that SCC - and the admission
  # webhook requires whoever CREATES the workspace to hold it too, precisely
  # so this cannot be used to escalate quietly.
  #
  # What it means: combined with cluster-wide `devworkspaces create` - RBAC
  # cannot scope `create` by name pattern - this ServiceAccount could start
  # SETUID/SETGID pods in any namespace it can reach. The `<username>-devspaces`
  # restriction is enforced in the plugin from the signed-in caller, not here.
  # It is the same capability Che's own ServiceAccount already holds, for the
  # same workspaces.
  #
  # Remove this and the plugin still creates namespaces and quotas; workspace
  # creation then fails with a message saying so.
  - apiGroups: ['security.openshift.io']
    resources: ['securitycontextconstraints']
    resourceNames: ['container-build']
    verbs: ['use']
  # The che-code editor definition, needed to build the workspace's editor
  # template. Nothing supplies an editor to a DevWorkspace automatically -
  # the Dev Spaces dashboard does that, so bypassing the dashboard means
  # doing it here. Read-only, one ConfigMap.
  - apiGroups: ['']
    resources: ['configmaps']
    resourceNames: ['editors-definitions', 'console-public']
    verbs: ['get']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devspaces-self-service-provisioner
  labels:
    app.kubernetes.io/managed-by: devspaces-self-service
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: devspaces-self-service-provisioner
subjects:
  - kind: ServiceAccount
    name: devspaces-provisioner
    namespace: rhdh
---
# Reading the UDI's published tool list. A Role rather than part of the
# ClusterRole above, because it is one ConfigMap in one namespace and there is
# no reason for the token to read ConfigMaps anywhere else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devspaces-self-service-udi-reader
  namespace: custom-udi
  labels:
    app.kubernetes.io/managed-by: devspaces-self-service
rules:
  - apiGroups: ['']
    resources: ['configmaps']
    resourceNames: ['udi-capabilities']
    verbs: ['get']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devspaces-self-service-udi-reader
  namespace: custom-udi
  labels:
    app.kubernetes.io/managed-by: devspaces-self-service
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: devspaces-self-service-udi-reader
subjects:
  - kind: ServiceAccount
    name: devspaces-provisioner
    namespace: rhdh
